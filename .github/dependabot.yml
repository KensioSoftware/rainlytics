---
version: 2

updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
    schedule:
      interval: "daily"
      time: "08:00"
      timezone: "Europe/London"
    cooldown:
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 5
      # Our own packages skip the wait: we publish them, so there is no
      # unknown publisher to wait out. This has to stay in step with
      # minimumReleaseAgeExclude in pnpm-workspace.yaml — pnpm holds new
      # releases back for a day of its own, and excluding a package here
      # without excluding it there just moves the wait to a bump PR whose
      # every job dies at "pnpm install --frozen-lockfile".
      exclude:
        - "@kensio/*"
    open-pull-requests-limit: 5
    # conventional-changelog-conventionalcommits has to stay on 9 while
    # semantic-release is on 25. Its 10 line returns the Handlebars templates as
    # functions, and conventional-changelog-writer 8 reads them as strings, so a
    # release goes out with a version number and no notes under it. Nothing
    # errors and no check fails: the first sign is an empty GitHub Release. See
    # .releaserc.yaml. Take this out when semantic-release moves to a writer
    # that reads the new shape.
    ignore:
      - dependency-name: "conventional-changelog-conventionalcommits"
        update-types:
          - "version-update:semver-major"
    groups:
      npm-patch-and-minor:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
    commit-message:
      prefix: "build"
      include: "scope"
    labels:
      - "dependencies"
    reviewers:
      - "hughgrigg"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "08:00"
      timezone: "Europe/London"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "build"
      include: "scope"
    labels:
      - "dependencies"
    reviewers:
      - "hughgrigg"
