---
# How a run of the release workflow becomes a published version. Run by
# .github/workflows/release.yml, which holds the account-side setup this
# depends on.
#
# YAML rather than JSON so the reasoning below can live next to the settings.

branches:
  - main

plugins:
  # Reads the commit subjects on main and works out the bump.
  #
  # Anything that ships is a patch. A minor is not something a commit subject
  # can ask for: it is the checkbox on the workflow, below. The reasoning is
  # that "is this significant enough to be a minor" is a judgement about the
  # release as a whole, made once, by a person looking at the whole batch —
  # not a judgement each commit subject should be trusted to make. Reserving
  # it that way is also what keeps the minor number meaning something.
  #
  # So the ladder is: patch automatically, minor by checkbox, major published
  # by hand from a working copy and never from this workflow at all.
  #
  # The breaking rule has to come first and has to be here. Without it the
  # feat rule below matches "feat!: …" too, and a breaking change would go out
  # as a patch — worse than any of this, because it would be silent. With it,
  # both "feat!: …" and a BREAKING CHANGE: footer reach the guard further
  # down and fail the run.
  #
  # docs, test, chore, ci and style are absent on purpose: they change nothing
  # a consumer installs, so they release nothing. The one to watch is a change
  # to what gets packed or how it is built, which changes what a consumer
  # installs without changing a line of source — commit those as `build:`,
  # which does release.
  - - "@semantic-release/commit-analyzer"
    - preset: conventionalcommits
      releaseRules:
        - breaking: true
          release: major
        - type: feat
          release: patch
        - type: fix
          release: patch
        - type: perf
          release: patch
        - type: refactor
          release: patch
        - type: build
          release: patch

  # The release notes, assembled from the commit subjects since the last tag.
  #
  # Which is to say from the pull request titles, when everything lands on main
  # as a squash: a subject is then the title someone wrote on a pull request
  # with the number GitHub appended to it, and both halves of that become links
  # — the number back to the pull request, the hash to the commit. A reader of
  # the release gets from a line of notes to the diff behind it in one click.
  #
  # Squash is the only merge method the repository allows, and the subject it
  # uses is the pull request title — which is the one .github/workflows/pr.yml
  # checks. That pairing is what makes these notes worth anything, and it lives
  # in repository settings rather than here, so it is recorded as item 4 in the
  # setup notes at the top of .github/workflows/release.yml. Allowing merge
  # commits or rebase merges again would put subjects on main that nothing
  # checked, and these notes would be only as good as whatever those happened
  # to be.
  #
  # There is no hand-written CHANGELOG.md, and the reason is not that generated
  # notes read better — they read worse, and that is the trade being made
  # here. It is that a committed changelog is a file every open
  # pull request edits in the same place, at the top, so merging any one of
  # them puts every other one into conflict. Notes assembled at release time
  # out of history cannot conflict with anything.
  #
  # What the notes are now worth is exactly what the pull request titles are
  # worth, which is why .github/workflows/pr.yml checks that a title parses
  # before it can become one.
  #
  # `types` is the whole list rather than an addition to the preset's: a type
  # not named here is left out of the notes entirely. So this is the list from
  # the analyzer above, given section headings. docs, test, chore, ci and style
  # are absent for the same reason they are absent there — they publish
  # nothing, so there is no release for them to describe.
  #
  # conventional-changelog-conventionalcommits is pinned to 9.3.1 in
  # package.json and cannot be taken to 10 while semantic-release is on 25.
  # Both plugins here reach for that package by name, but the notes generator
  # renders it through conventional-changelog-writer 8, which is Handlebars
  # and reads `mainTemplate` and the partials as strings; the preset's 10 line
  # returns functions instead. Nothing errors when they are mismatched. The
  # header renders, every commit is dropped, and the release goes out with a
  # version number and no notes under it — which is how this bites you: no
  # check fails and nothing in a bump pull request looks wrong, because there
  # is nothing for a major version of a preset to break until release time.
  # .github/dependabot.yml holds it back, and that entry is the only thing
  # keeping this pin in place.
  - - "@semantic-release/release-notes-generator"
    - preset: conventionalcommits
      presetConfig:
        types:
          - type: feat
            section: Added
          - type: fix
            section: Fixed
          - type: perf
            section: Faster
          - type: refactor
            section: Changed
          - type: build
            section: Packaging

  # Two commands, and between them what this repository does differently from a
  # stock semantic-release setup.
  #
  # analyzeCommitsCmd raises the release to a minor when the workflow was
  # started with its checkbox ticked. semantic-release takes the highest
  # result across every analyzer, so this can only ever raise a patch to a
  # minor — it cannot lower anything, and it leaves a major alone. Printing
  # nothing, which is what happens when the box is unticked, is read as "no
  # opinion" rather than "no release".
  #
  # verifyReleaseCmd refuses a major, after the version is worked out and
  # before anything is published, because a breaking change is a decision about
  # what consumers have to rewrite, made by a person publishing by hand rather
  # than by a marker in a subject line. Mapping them down to a minor was
  # rejected, since it would put a false version number against a genuinely
  # breaking change.
  #
  - - "@semantic-release/exec"
    - analyzeCommitsCmd: >-
        if [ "$RELEASE_MINOR" = "true" ]; then echo minor; fi
      verifyReleaseCmd: >-
        if [ "${nextRelease.type}" = "major" ]; then
        echo "Refusing to publish ${nextRelease.version} automatically:
        major releases are published by hand." >&2;
        exit 1;
        fi
      # Read by the workflow, which needs the version to open the pull request
      # that catches package.json up. Guarded because this file is also
      # runnable outside Actions, where the variable is unset and the redirect
      # would be an error.
      successCmd: >-
        if [ -n "$GITHUB_OUTPUT" ]; then
        echo "version=${nextRelease.version}" >> "$GITHUB_OUTPUT";
        fi

  # Publishes to npm. No NPM_TOKEN anywhere: the npm CLI detects the OIDC
  # token the workflow requests and exchanges it for a credential that lasts
  # the length of this one publish, which is also what makes npm attach a
  # provenance attestation. Needs npm >= 11.5.1, which the Node in .nvmrc
  # carries.
  #
  # The tarball is built by prepack, and pack:check has already proved that
  # build packs correctly on this same commit.
  - "@semantic-release/npm"

  # Creates the git tag and the GitHub Release, with the generated notes as its
  # body. That release is now the only place the notes exist — there is no file
  # in the repository holding them, and none in the tarball either.
  #
  # Note there is no @semantic-release/git plugin: nothing here commits the
  # bumped version back to main directly. It could not work under main's
  # intended ruleset anyway — three passing status checks on whatever lands
  # there, and a commit made inside this run has none. The pull request the
  # workflow opens is that commit taking the ordinary route instead. The
  # ruleset in question targets branches, so it has nothing to say about the
  # tag semantic-release pushes — though rulesets can target tags too, so that
  # is a statement about this one rather than about rulesets.
  - - "@semantic-release/github"
    # The released-in comments this would otherwise leave on every merged pull
    # request and closed issue. The GitHub Release is the announcement.
    - successComment: false
      failComment: false
